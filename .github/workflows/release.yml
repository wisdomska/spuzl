name: Release

# On every push to main:
#  - tag the version in package.json (annotated, v<version>) if that tag does not exist yet, with the owner
#    as tagger and the matching CHANGELOG.md section as the tag message;
#  - remove tool-appended "Generated by" footers and session links from pull request descriptions, open or
#    merged, because the owner is the only author of this repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v<version> if missing
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists"; exit 0
          fi
          # The CHANGELOG section for this version becomes the tag message.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; print "SPUZL " v; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > tag-message.txt
          [ -s tag-message.txt ] || echo "SPUZL $version" > tag-message.txt
          git config user.name "wisdomska(senya)"
          git config user.email "102672450+wisdomska@users.noreply.github.com"
          git tag -a "$tag" -F tag-message.txt "$GITHUB_SHA"
          git push origin "$tag"
          echo "Tagged $tag at $GITHUB_SHA"

  tidy-pr-descriptions:
    name: Tidy pull request descriptions
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Strip tool-appended footers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/pulls?state=all&per_page=100" --jq '.[].number' | while read -r n; do
            gh api "repos/$REPO/pulls/$n" --jq '.body // ""' > body.md
            python3 - <<'PY'
          import re
          s = open("body.md").read()
          lines = [l for l in s.split("\n")
                   if not re.match(r"^\s*_?Generated by \[?Claude", l, re.I)
                   and not re.match(r"^\s*https://claude\.ai/code/session_\S+\s*$", l)]
          out = "\n".join(lines).rstrip()
          out = re.sub(r"\n-{3,}\s*$", "", out).rstrip() + "\n"
          open("clean.md", "w").write(out)
          open("changed", "w").write("1" if out.strip() != s.strip() else "")
          PY
            if [ -s changed ]; then
              gh api -X PATCH "repos/$REPO/pulls/$n" -F body=@clean.md > /dev/null
              echo "Cleaned the description of #$n"
            fi
          done
