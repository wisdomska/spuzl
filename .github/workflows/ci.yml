name: CI

on:
  pull_request:
    branches: [main, preview]
  push:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorship:
    name: Authorship
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject AI attribution in PR commits
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          if git log --format='%an <%ae>%n%B' "$base..$head" | grep -iE 'co-authored-by|generated with|claude|anthropic'; then
            echo "::error::AI attribution found in commit messages or authors"; exit 1
          fi
      - name: Remove tool-appended footers from the PR description
        # Some tooling appends a "Generated by" footer or a session link to PR bodies it touches. The owner is
        # the only author, so strip those lines from the live body before checking it.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR" --jq .body > body.md
          python3 - <<'PY'
          import re
          s = open("body.md").read()
          lines = [l for l in s.split("\n")
                   if not re.match(r"^\s*_?Generated by \[?Claude", l, re.I)
                   and not re.match(r"^\s*https://claude\.ai/code/session_\S+\s*$", l)]
          out = "\n".join(lines).rstrip()
          out = re.sub(r"\n-{3,}\s*$", "", out).rstrip() + "\n"
          open("clean.md", "w").write(out)
          open("changed", "w").write("1" if out.strip() != s.strip() else "")
          PY
          if [ -s changed ]; then
            gh api -X PATCH "repos/${{ github.repository }}/pulls/$PR" -F body=@clean.md > /dev/null
            echo "Removed tool-appended footer lines from the PR description."
          fi
      - name: Reject AI attribution in PR description
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.title + "\n" + .body')
          if printf '%s\n' "$body" | grep -iE 'co-authored-by|generated with|claude|anthropic'; then
            echo "::error::AI attribution found in the PR title or description"; exit 1
          fi

  check:
    name: Typecheck, lint, format, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Prove every generated Daily has exactly one solution
        run: pnpm validate:dailies --days 14

  db:
    name: Database (pgTAP) and API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The default image registry (public.ecr.aws) rate-limits anonymous pulls ("toomanyrequests"). Try it,
      # then the Docker Hub mirror of the same images, with a pause between attempts.
      - name: Start Supabase
        run: |
          for i in 1 2 3 4; do
            if [ "$i" -gt 2 ]; then export SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io; fi
            pnpm supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor && exit 0
            pnpm supabase stop --no-backup || true
            echo "supabase start failed (attempt $i), retrying in $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1
      - run: pnpm supabase test db
      - name: API integration
        run: |
          pnpm supabase status -o env | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' | tr -d '"' > .env.local
          echo "ENABLE_DEV_ROUTES=1" >> .env.local
          echo "CRON_SECRET=ci-cron-secret" >> .env.local
          echo "INITIAL_OWNER_EMAIL=owner@ci.spuzl.test" >> .env.local
          # The admin calendar tests read Dailies up to 55 days ahead: fill the schedule like production does.
          (set -a; . ./.env.local; set +a; pnpm gen:puzzles --days 60)
          pnpm build
          (SETTINGS_CACHE_MS=0 pnpm start -p 3000 &) && npx wait-on http://localhost:3000/api/health -t 60000
          pnpm vitest run -c vitest.api.config.mts

  build:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
      - name: Service-role key must never reach the client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|service_role" .next/static; then echo "::error::service role reference in client bundle"; exit 1; fi
      - run: node scripts/check-bundle-budget.mjs
