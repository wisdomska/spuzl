name: Keep-alive

# Supabase Free pauses projects after 7 days without activity. /api/health runs `select 1`.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Production
        run: curl -fsS --retry 3 https://spuzl.vercel.app/api/health
      - name: Preview
        run: curl -fsS --retry 3 https://spuzl-preview.vercel.app/api/health
