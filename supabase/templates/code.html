<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 24px; background: #0e0f1a; font-family: Arial, Helvetica, sans-serif; color: #f4f5fb">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 440px; margin: 0 auto; background: #171929; border-radius: 20px"
    >
      <tr>
        <td style="padding: 28px 28px 8px">
          <p style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.5px">SPUZ<span style="color: #b8f23a">L</span></p>
        </td>
      </tr>
      <tr>
        <td style="padding: 8px 28px 4px">
          <p style="margin: 0 0 6px; font-size: 18px; font-weight: 700">Your sign-in code</p>
          <p style="margin: 0; font-size: 15px; color: #a2a6c2">Type this code in SPUZL to sign in. It works for 10 minutes.</p>
        </td>
      </tr>
      <tr>
        <td style="padding: 18px 28px">
          <p
            style="
              margin: 0;
              padding: 16px 0;
              text-align: center;
              background: #0e0f1a;
              border-radius: 14px;
              font-size: 36px;
              font-weight: 900;
              letter-spacing: 10px;
              color: #b8f23a;
            "
          >
            {{ .Token }}
          </p>
        </td>
      </tr>
      <tr>
        <td style="padding: 0 28px 28px">
          <p style="margin: 0; font-size: 13px; color: #a2a6c2">
            Didn't ask for this? You can ignore this email. Nobody can sign in without the code.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
